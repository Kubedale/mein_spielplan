name: Neue Spielstätte eintragen

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  eintragen:
    # Nur Formulare der Projekt-Besitzerin werden verarbeitet; andere Besucher können nichts eintragen.
    # Das Formular wird an seinem Inhalt erkannt (nicht nur am Etikett, das GitHub nur vergibt,
    # wenn es im Projekt existiert). Nachträglich auslösen: Etikett "neue-spielstaette" vergeben.
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      contains(github.event.issue.body, '### Website') &&
      (github.event.action == 'opened' || github.event.label.name == 'neue-spielstaette')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Spielstätte testen und eintragen
        id: test
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NR: ${{ github.event.issue.number }}
        run: python werkzeuge/neue_spielstaette.py
      - name: Seiten für die Fehlersuche ablegen
        if: steps.test.outputs.ok != 'true' && hashFiles('diagnose/*.html') != ''
        env:
          ISSUE_NR: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "diagnose/formular-$ISSUE_NR"
          git add -f diagnose
          git commit -q -m "Diagnose zu Formular #$ISSUE_NR"
          git push -f origin "diagnose/formular-$ISSUE_NR"
          git checkout -q main
      - name: Änderung speichern
        if: steps.test.outputs.ok == 'true'
        env:
          ISSUE_NR: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orte.json
          git commit -m "Neue Spielstätte aus Formular #$ISSUE_NR"
          git push
      - name: Spielplan neu erstellen
        if: steps.test.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run spielplan.yml --repo "$GITHUB_REPOSITORY"
      - name: Rückmeldung im Formular
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NR: ${{ github.event.issue.number }}
          OK: ${{ steps.test.outputs.ok }}
        run: |
          [ -f ergebnis.md ] || echo "❌ Der Test ist abgebrochen, bevor er ein Ergebnis schreiben konnte." > ergebnis.md
          cat ergebnis.md >> "$GITHUB_STEP_SUMMARY"
          python -c "import json; print(json.dumps({'body': open('ergebnis.md', encoding='utf-8').read()}))" > kommentar.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NR/comments" --input kommentar.json --jq .html_url
          if [ "$OK" = "true" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NR" -f state=closed --jq .state
          fi
